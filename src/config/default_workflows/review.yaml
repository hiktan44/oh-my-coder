name: review
description: kodincelemeakis: kesfet → kodinceleme + guvenlikinceleme (vesatir) 
steps:
  - id: explore
    agent: explore
    description: kod tabani yapisini kesfet
    timeout: 300
    retry: 0
  - id: code-reviewer
    agent: code-reviewer
    description: kodinceleme
    dependencies: [explore]
    timeout: 600
    retry: 0
  - id: security-reviewer
    agent: security-reviewer
    description: guvenlikinceleme
    dependencies: [explore]
    timeout: 600
    retry: 0
