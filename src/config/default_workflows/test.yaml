name: test
description: testolusturakis: kesfet → tasarimtest → uygulatest → satirtest
steps:
  - id: explore
    agent: explore
    description: kod tabani yapisini kesfet
    timeout: 300
    retry: 0
  - id: test-engineer
    agent: test-engineer
    description: tasarimtest durumu
    dependencies: [explore]
    timeout: 300
    retry: 0
  - id: executor
    agent: executor
    description: uygulatestkod
    dependencies: [test-engineer]
    timeout: 600
    retry: 1
  - id: verifier
    agent: verifier
    description: test dogrulama calistir
    dependencies: [executor]
    timeout: 300
    retry: 0
