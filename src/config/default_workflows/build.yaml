name: build
description: tamolusturakis: kesfet → analiz → plan → mimari → uygula → dogrulama
steps:
  - id: explore
    agent: explore
    description: kod tabani yapisini kesfet
    timeout: 300
    retry: 0
  - id: analyst
    agent: analyst
    description: analizgerekisteilemevcut durum
    dependencies: [explore]
    timeout: 300
    retry: 1
  - id: planner
    agent: planner
    description: olusturdetayliyurutplan
    dependencies: [analyst]
    timeout: 300
    retry: 0
  - id: architect
    agent: architect
    description: tasarimsistemmimari
    dependencies: [planner]
    timeout: 300
    retry: 0
  - id: executor
    agent: executor
    description: uygulakod
    dependencies: [architect]
    timeout: 600
    retry: 1
  - id: verifier
    agent: verifier
    description: dogrulamauyguladogru
    dependencies: [executor]
    timeout: 300
    retry: 0
