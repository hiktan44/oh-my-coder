name: doc
description: dokumantasyonolusturakis: mimari tasarim → ilk taslak yazyaz → uzunlukyaziince ayar → tamkontroldogrula
steps:
  - id: architect
    agent: architect
    description: mimari tasarimiledokumantasyoniskelet
    timeout: 300
    retry: 0
  - id: writer
    agent: writer
    description: icerikilk taslak yazyaz
    dependencies: [architect]
    timeout: 600
    retry: 1
  - id: document
    agent: document
    description: uzunlukyazidokumantasyonince ayarileformat
    dependencies: [writer]
    timeout: 600
    retry: 0
  - id: verifier
    agent: verifier
    description: dokumantasyontamkontroldogrula
    dependencies: [document]
    timeout: 300
    retry: 0
