name: debug
description: hata ayikladuzeltmeakis: kesfet → hata ayikla → dogrulama
steps:
  - id: explore
    agent: explore
    description: kesfetkodkutuphanekonumsorun
    timeout: 300
    retry: 0
  - id: debugger
    agent: debugger
    description: hata ayiklaveduzeltmesorun
    dependencies: [explore]
    timeout: 600
    retry: 1
  - id: verifier
    agent: verifier
    description: dogrulamaduzeltmedogru
    dependencies: [debugger]
    timeout: 300
    retry: 0
