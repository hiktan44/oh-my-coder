name: refactor
description: yeniden duzenlemeakis: analizsicaknokta → olusturplan → yurutyeniden duzenleme → dogrulama → test
steps:
  - id: analyst
    agent: analyst
    description: analizkodsicaknoktavekotutat
    timeout: 300
    retry: 0
  - id: planner
    agent: planner
    description: olusturyeniden duzenlemeplan
    dependencies: [analyst]
    timeout: 300
    retry: 0
  - id: code-simplifier
    agent: code-simplifier
    description: yurutyeniden duzenleme
    dependencies: [planner]
    timeout: 600
    retry: 1
  - id: verifier
    agent: verifier
    description: dogrulamayeniden duzenlemedogru
    dependencies: [code-simplifier]
    timeout: 300
    retry: 0
  - id: test-engineer
    agent: test-engineer
    description: satirtestsaglaryokgerigeri
    dependencies: [verifier]
    timeout: 300
    retry: 0
