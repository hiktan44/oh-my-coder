name: Ayar erişimi ve anahtar güvenliği
on:
  push:
    branches: [main, 'codex/f58-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  settings-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bağımlılıklarını kur
        run: python -m pip install -e '.[dev,web]'
      - name: Gerçek HTTP ve geçici dosya testleri
        run: python scripts/test-settings-security.py
      - name: Ayar ekranı işlevlerini ve JavaScript sözdizimini doğrula
        run: node --test tests/settings-client-security.test.mjs
      - name: Python sözdizimini doğrula
        run: python -m compileall -q src/web/app.py src/web/settings_security.py
      - name: Değişen Python dosyalarının Ruff kontrolü
        run: ruff check src/web/app.py src/web/settings_security.py scripts/test-settings-security.py tests/test_settings_security.py tests/test_web_app_routes.py tests/test_web_app_more.py tests/test_web_app_extended.py tests/test_web_history_api.py
